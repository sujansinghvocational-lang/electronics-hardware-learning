<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Test</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}
header{
background:#0d47a1;
color:white;
padding:20px;
text-align:center;
}
.container{
max-width:700px;
margin:auto;
background:white;
padding:20px;
margin-top:20px;
border-radius:10px;
}
button{
background:#0d47a1;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>Electronics MCQ Test</h1>
</header>

<div class="container">

<h3>1. Resistance is measured in?</h3>

<input type="radio" name="q1"> Volt<br>
<input type="radio" name="q1" id="correct"> Ohm<br>
<input type="radio" name="q1"> Ampere<br><br>

<button onclick="check()">Submit</button>

<p id="result"></p>

</div>

<script>
function check(){
if(document.getElementById("correct").checked){
document.getElementById("result").innerHTML="✅ Correct Answer";
}else{
document.getElementById("result").innerHTML="❌ Wrong Answer";
}
}
</script>

</body>
</html>
